# The site (site/) starts this through the GitHub API. backend/session.py says
# what each action does and how the page and the run talk to each other.
name: Studio session
run-name: "Studio ${{ inputs.action }} ${{ inputs.session_id }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "login (finish a Google sign-in) or start (run Roblox Studio on a cloud GPU)"
        type: choice
        options: [start, login]
        default: start
      session_id:
        description: "Random id the page picked"
        required: true
      key_hash:
        description: "SHA-256 of the session key only the page knows"
        required: true
      page_key:
        description: "login: the page's one-time public key (base64)"
        default: ""
      options:
        description: 'start: {"gpu","w","h","fps","bitrate","dpi","minutes"}'
        default: "{}"

permissions:
  contents: read
  statuses: write

# One run per session, even if the page asks twice.
concurrency:
  group: studio-${{ inputs.session_id }}
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SESSION_ID: ${{ inputs.session_id }}
      KEY_HASH: ${{ inputs.key_hash }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the colab CLI
        run: pip install -q -r backend/requirements.txt

      - name: Finish the Google sign-in
        if: inputs.action == 'login'
        env:
          PAGE_KEY: ${{ inputs.page_key }}
          # Google may list the granted scopes in another order than requested.
          OAUTHLIB_RELAX_TOKEN_SCOPE: "1"
        run: python backend/session.py login

      - name: Build the session notebook and run Studio on a cloud GPU
        if: inputs.action == 'start'
        env:
          OPTIONS: ${{ inputs.options }}
        run: python backend/session.py start

      - name: Release the cloud machine
        if: always() && inputs.action == 'start'
        run: python backend/session.py cleanup

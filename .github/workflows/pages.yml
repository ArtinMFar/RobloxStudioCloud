# Publishes site/ to GitHub Pages. Turn Pages on once:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#
# If the repository has a SITE_TOKEN secret (a fine-grained token with only
# "Actions: Read and write" on this repository), it is built into the published
# site, so visitors can start Studio without an access key of their own. Anyone
# can read it from the published page, which is why it should be able to do
# nothing but run this repository's workflows. Without it, visitors paste an
# access key in the site's Settings.
name: Publish the site

on:
  push:
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off for this repository. Turn it on in Settings -> Pages (Source: GitHub Actions), then run this workflow again."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Write the site's settings
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg = {"repo": os.environ["GITHUB_REPOSITORY"]}
          if os.environ.get("SITE_TOKEN"):
              cfg["token"] = os.environ["SITE_TOKEN"]
          open("site/config.js", "w").write("window.RSC_CONFIG = " + json.dumps(cfg) + ";\n")
          print("access key built in:", "yes" if "token" in cfg else "no (visitors paste one in Settings)")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
